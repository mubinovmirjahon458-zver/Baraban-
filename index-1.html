<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Omadli baraban</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#120E2B; --plum:#241A55; --gold:#F6B73C; --gold-d:#C98A12;
    --mint:#36D9A0; --text:#F4F1FF; --muted:#A79FD0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;overflow-x:hidden}
  body{background:radial-gradient(120% 70% at 50% 0%,#3a2a86 0%,var(--ink) 62%) no-repeat,var(--ink);min-height:100vh}
  .app{max-width:460px;margin:0 auto;padding:16px 18px 28px;display:flex;flex-direction:column;align-items:center;gap:18px}

  .top{width:100%;display:flex;justify-content:space-between;align-items:center}
  .spins-left{font-size:13px;color:var(--muted);font-weight:700}
  .spins-left b{color:var(--text)}
  .balance{display:flex;align-items:center;gap:8px;background:var(--plum);border:1px solid #4a3cae;
    border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--text);cursor:pointer}
  .balance .coin{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 var(--gold-d)}

  h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px;line-height:1.25;
    text-align:center;margin:6px 0 0;letter-spacing:-.01em}

  .stage{position:relative;width:min(88vw,380px);aspect-ratio:1}
  .rim{position:absolute;inset:-10px;border-radius:50%;
    background:conic-gradient(from 0deg,#F6B73C,#fff1c4,#F6B73C,#C98A12,#F6B73C,#fff1c4,#F6B73C,#C98A12,#F6B73C);
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  #wheel{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
    transition:transform 5.2s cubic-bezier(.12,.62,.08,1)}
  .pointer{position:absolute;top:-22px;left:50%;transform:translateX(-50%);z-index:3;
    width:34px;height:42px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .hub{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);
    width:30%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#3d2f94,var(--ink) 75%);
    border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;
    text-align:center;box-shadow:0 0 0 5px rgba(18,14,43,.6),0 6px 18px rgba(0,0,0,.5)}
  .hub span{font-family:'Unbounded',sans-serif;font-weight:500;font-size:clamp(11px,3.4vw,14px);
    line-height:1.2;color:var(--gold);padding:0 4px}

  .actions{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:6px}
  button{font-family:inherit;border:0;cursor:pointer;font-weight:800;font-size:16px;
    border-radius:16px;padding:16px;transition:transform .12s,opacity .2s}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .spin{background:linear-gradient(180deg,#ffd36b,var(--gold));color:#2a1c00;
    box-shadow:0 5px 0 var(--gold-d),0 12px 24px rgba(246,183,60,.3)}
  .invite{background:transparent;color:var(--text);border:2px solid var(--mint)}
  .invite small{display:block;font-weight:600;font-size:12px;color:var(--mint);margin-top:2px}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin:0}

  .modal{position:fixed;inset:0;background:rgba(10,7,30,.78);display:none;align-items:center;
    justify-content:center;padding:24px;z-index:10}
  .modal.show{display:flex}
  .card{background:var(--plum);border:1px solid #4a3cae;border-radius:24px;padding:28px 24px;
    width:100%;max-width:340px;text-align:center}
  .card .big{font-family:'Unbounded',sans-serif;font-size:34px;color:var(--gold);margin:8px 0}
  .card p{margin:0 0 18px;color:var(--muted);font-weight:600}
  .card button{width:100%;background:var(--gold);color:#2a1c00}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="spins-left">Urinishlar: <b id="left">0</b></div>
    <div class="balance" id="balanceBtn"><span class="coin"></span><span id="balance">0</span> so'm</div>
  </div>

  <h1>Omadingizni sinab ko'ring</h1>

  <div class="stage">
    <div class="rim"></div>
    <svg class="pointer" viewBox="0 0 34 42"><path d="M17 42 L2 10 A17 17 0 1 1 32 10 Z" fill="#fff"/><circle cx="17" cy="14" r="6" fill="#d33"/></svg>
    <canvas id="wheel"></canvas>
    <div class="hub"><span>«Mubinov»</span></div>
  </div>

  <div class="actions">
    <button class="spin" id="spinBtn">Aylantirish</button>
    <button class="invite" id="inviteBtn">Do'stni taklif qilish<small>+2 ta qo'shimcha urinish</small></button>
    <p class="hint">Kuniga 3 ta bepul urinish. Yutuq balansingizga qo'shiladi.</p>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <div id="mTitle">Tabriklaymiz!</div>
    <div class="big" id="mAmount">0</div>
    <p id="mText">balansingizga qo'shildi</p>
    <button id="mClose">Yopish</button>
  </div>
</div>

<script>
/* ================= SOZLAMALAR ================= */
const BOT_USERNAME = "SIZNING_BOT_USERNAME";   // masalan: slayd_uz_bot (@ siz)
const API_URL = "";                            // backend manzili. Bo'sh bo'lsa — demo rejim
const DAILY_FREE = 3;                          // kunlik bepul urinish
const INVITE_BONUS = 2;                        // do'st taklif qilinsa beriladigan urinish

// 15 ta bo'lim (eng katta — 1 800). weight — tushish ehtimoli (kichigi ko'proq tushadi)
const PRIZES = [
  {v:100,w:20},{v:500,w:6},{v:200,w:14},{v:1800,w:1},{v:150,w:16},
  {v:1000,w:3},{v:300,w:10},{v:50,w:22},{v:700,w:4},{v:250,w:12},
  {v:1200,w:2},{v:400,w:8},{v:100,w:20},{v:900,w:3},{v:600,w:5}
];
/* ============================================== */

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{tg.setHeaderColor('#120E2B');tg.setBackgroundColor('#120E2B');}catch(e){} }
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const uid = user ? user.id : 'demo';

const fmt = n => n.toLocaleString('ru-RU').replace(/\u00a0/g,' ');
const today = () => new Date().toISOString().slice(0,10);

/* --- holat (demo rejimda localStorage; haqiqiy loyihada backend) --- */
const KEY = 'wheel_' + uid;
function load(){
  let s; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || s.day !== today()) s = {day: today(), used: 0, bonus: 0, balance: s ? s.balance : 0};
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let state = load();
let serverLeft = null;
const spinsLeft = () => serverLeft !== null ? serverLeft : Math.max(0, DAILY_FREE + state.bonus - state.used);

/* --- baraban chizish --- */
const N = PRIZES.length, SEG = 360 / N;
const COLORS = ['#6C4DFF','#F6B73C','#FF5F7E','#36D9A0','#2E90FF'];
const canvas = document.getElementById('wheel');
function draw(){
  const size = canvas.getBoundingClientRect().width || 340;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.height = size * dpr;
  const c = canvas.getContext('2d'); c.scale(dpr, dpr);
  const R = size/2; c.clearRect(0,0,size,size);
  for(let i=0;i<N;i++){
    const a0 = (-90 + i*SEG) * Math.PI/180, a1 = (-90 + (i+1)*SEG) * Math.PI/180;
    c.beginPath(); c.moveTo(R,R); c.arc(R,R,R,a0,a1); c.closePath();
    c.fillStyle = COLORS[i % COLORS.length]; c.fill();
    c.strokeStyle = 'rgba(18,14,43,.55)'; c.lineWidth = 2; c.stroke();
    // yozuv
    c.save(); c.translate(R,R); c.rotate((a0+a1)/2);
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillStyle = (COLORS[i % COLORS.length] === '#F6B73C') ? '#2a1c00' : '#fff';
    c.font = '800 ' + Math.round(size*0.052) + 'px Manrope, sans-serif';
    c.fillText(fmt(PRIZES[i].v), R*0.9, 0);
    c.restore();
  }
}

/* --- UI yangilash --- */
const $ = id => document.getElementById(id);
function render(){
  $('balance').textContent = fmt(state.balance);
  $('left').textContent = spinsLeft();
  $('spinBtn').disabled = spinning || spinsLeft() === 0;
}

/* --- aylantirish --- */
let spinning = false, rotation = 0;
function pickIndex(){
  const total = PRIZES.reduce((s,p)=>s+p.w,0);
  let r = Math.random() * total;
  for(let i=0;i<N;i++){ r -= PRIZES[i].w; if(r < 0) return i; }
  return 0;
}
async function getResult(){
  if(!API_URL) return pickIndex();  // DEMO: natija telefonda tanlanadi
  // HAQIQIY: natijani serverda tanlang va initData bilan tekshiring
  const r = await fetch(API_URL + '/spin', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({initData: tg ? tg.initData : ''})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'xato');
  return j.index;
}
async function spin(){
  if(spinning || spinsLeft() === 0) return;
  spinning = true; render();
  let idx;
  try{ idx = await getResult(); }catch(e){ spinning = false; render(); return alert('Xatolik. Qayta urinib ko\'ring.'); }
  if(!API_URL){ state.used++; save(); } else if(serverLeft !== null){ serverLeft--; }
  const jitter = (Math.random() - .5) * SEG * 0.7;
  const center = (idx + .5) * SEG;
  const need = ((-(center + jitter) - rotation) % 360 + 360) % 360;
  rotation += 360 * 6 + need;
  canvas.style.transform = 'rotate(' + rotation + 'deg)';
  if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  setTimeout(() => {
    spinning = false;
    const win = PRIZES[idx].v;
    state.balance += win; if(!API_URL) save();
    render();
    if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    showModal('Tabriklaymiz!', fmt(win) + " so'm", "balansingizga qo'shildi");
  }, 5300);
}

/* --- do'stni taklif qilish --- */
function invite(){
  const link = 'https://t.me/' + BOT_USERNAME + '?start=ref_' + uid;
  const text = "Slayd tayyorlaydigan botda omadingni sina va pul yut!";
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text);
  if(tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
  // Haqiqiy rejim: bonusni backend beradi (do'st botga /start ref_... bilan kirganda).
  // Demo rejim: faqat sinab ko'rish uchun share'dan keyin bonus beriladi.
  if(!API_URL){
    setTimeout(() => { state.bonus += INVITE_BONUS; save(); render();
      showModal('Rahmat!', '+' + INVITE_BONUS, 'qo\'shimcha urinish berildi (demo)'); }, 1500);
  }
}

function showModal(t, a, p){
  $('mTitle').textContent = t; $('mAmount').textContent = a; $('mText').textContent = p;
  $('modal').classList.add('show');
}
$('mClose').onclick = () => $('modal').classList.remove('show');
$('spinBtn').onclick = spin;
$('inviteBtn').onclick = invite;
$('balanceBtn').onclick = () => showModal('Balansingiz', fmt(state.balance) + " so'm", 'Xizmatlar uchun to\'lashda ishlatiladi');

/* --- server rejimida holatni olish --- */
async function init(){
  if(API_URL){
    try{
      const r = await fetch(API_URL + '/state', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({initData: tg ? tg.initData : ''})});
      const j = await r.json();  // {balance, spinsLeft}
      state.balance = j.balance;
      serverLeft = j.spinsLeft;
    }catch(e){}
  }
  draw(); render();
}
window.addEventListener('resize', draw);
init();
</script>
</body>
</html>
